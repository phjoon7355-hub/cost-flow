<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>요소별원가계산 Interactive</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="top-bar">

        <h1>요소별원가계산</h1>

        <p class="subtitle">
            문제를 맞히면 원가가 실제로 이동합니다.
        </p>

    </header>


    <main>

        <section class="workspace">


            <!-- 원재료 -->

            <div class="account-card" id="rawMaterial">

                <h2>원재료</h2>

                <div class="t-account">

                    <div class="left">

                        <div class="label">차변</div>

                        <div class="cell">
                            기초재료
                        </div>

                    </div>

                    <div class="center-line"></div>

                    <div class="right">

                        <div class="label">대변</div>

                        <div class="cell answer-box" id="rawAnswer">
                            ?
                        </div>

                    </div>

                </div>

            </div>



            <!-- 화살표 -->

            <div class="flow-arrow">

                ➜

            </div>



            <!-- 재공품 -->

            <div class="account-card hidden" id="workInProcess">

                <h2>재공품</h2>

                <div class="t-account">

                    <div class="left">

                        <div class="label">차변</div>

                        <div class="cell answer-box" id="materialAnswer">
                            ?
                        </div>

                        <div class="cell">
                            노무비
                        </div>

                        <div class="cell">
                            제조간접비
                        </div>

                    </div>

                    <div class="center-line"></div>

                    <div class="right">

                        <div class="label">대변</div>

                    </div>

                </div>

            </div>

        </section>



        <!-- 입력 -->

        <section class="quiz-panel">

            <h2 id="questionTitle">

                문제 1

            </h2>

            <p id="questionText">

                원재료의 대변 빈칸에 들어갈 계정과목은?

            </p>

            <input

                type="text"

                id="answerInput"

                placeholder="정답을 입력하세요"

                autocomplete="off">

            <button id="checkButton">

                확인

            </button>

        </section>




        <!-- 상태 -->

        <section class="message-panel">

            <div id="message">

                시작해보세요!

            </div>

        </section>




        <!-- 이동 애니메이션 카드 -->

        <div id="movingCard">

            소비액

        </div>

    </main>




    <footer>

        <p>

            Element Cost Interactive Learning

        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
